[project]
name = "pdf2md"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rdndds", email = "rdndds@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "loguru>=0.8.0",
    "pymupdf4llm-rs>=0.4.3",
]

[project.scripts]
pdf2md = "pdf2md:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
